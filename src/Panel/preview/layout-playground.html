<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearthwoven layout playground</title>
<!-- The layout table (src/Panel/PanelLayout.cs) as sliders over any preview page. Each change reloads the page with ?set=name:px,...,
     which panel-preview.html lays over layout.css before it draws; nothing is saved. "Copy changes" gives the lines to change in
     PanelLayout.cs; after that, KsPanelTest --dump writes layout.css and layout.js again and the game reads the same values.
     A value worked out from others (Feats.GridRoom) has no slider: it follows them after the next --dump. -->
<script src="layout.js"></script>
<script src="preview-data.js"></script>
<style>
  :root { --bg:#141210; --panel:#1d1a16; --line:#3a3128; --text:#e9dcc4; --muted:#b9a688; --gold:#e8c27a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 Georgia, serif; display:flex; height:100vh; overflow:hidden; }
  #side { width:330px; flex:none; display:flex; flex-direction:column; border-right:1px solid var(--line); background:var(--panel); }
  #top { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  #top select, #top input { width:100%; background:#100e0c; color:var(--text); border:1px solid var(--line); padding:5px 6px; font:inherit; }
  #buttons { display:flex; gap:6px; } #buttons button { flex:1; background:#2a241d; color:var(--gold); border:1px solid #5a4630; padding:6px; font:inherit; cursor:pointer; }
  #tokens { overflow:auto; padding:6px 14px 20px; flex:1; }
  h2 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:14px 0 4px; font-weight:400; }
  .t { display:grid; grid-template-columns:96px 1fr 38px; gap:8px; align-items:center; padding:2px 0; }
  .t label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .t.changed label, .t.changed output { color:var(--gold); font-weight:700; }
  .t output { text-align:right; font-variant-numeric:tabular-nums; cursor:pointer; } .t input { width:100%; accent-color:#e8a948; }
  #out { display:none; margin:8px 14px 12px; height:140px; background:#100e0c; color:var(--text); border:1px solid var(--line); font:12px/1.4 Menlo, monospace; padding:6px; }
  #stage { flex:1; position:relative; overflow:hidden; }
  #stage iframe { position:absolute; left:0; top:0; width:1280px; height:860px; border:0; transform-origin:0 0; }
  .note { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div id="side">
  <div id="top">
    <select id="view"></select>
    <input id="find" placeholder="Find a value (island, hero, legend ...)">
    <div id="buttons"><button id="copy">Copy changes</button><button id="reset">Reset all</button></div>
    <div class="note">Click a number to set it back.</div>
  </div>
  <textarea id="out" readonly></textarea>
  <div id="tokens"></div>
</div>
<div id="stage"><iframe id="page"></iframe></div>
<script>
const all = (window.PANEL_LAYOUT || []).map(([cls, field, value, computed]) => ({ cls, field, value, computed, now: value,
  css: ("--" + (cls + "-" + field).replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase()).slice(2) }));
const views = Object.keys(window.PANEL_DATA || {});
const keep = (() => { try { return JSON.parse(localStorage.getItem("hw-layout-playground") || "{}"); } catch { return {}; } })();
const save = () => { try { localStorage.setItem("hw-layout-playground", JSON.stringify({ view: view.value, set: Object.fromEntries(all.filter(t => t.now !== t.value).map(t => [t.css, t.now])) })); } catch { } };
const view = document.getElementById("view"), find = document.getElementById("find"), list = document.getElementById("tokens"), out = document.getElementById("out"), page = document.getElementById("page");
view.innerHTML = views.map(v => `<option>${v}</option>`).join("");
view.value = views.includes(keep.view) ? keep.view : views.includes("deeds-woodcutting") ? "deeds-woodcutting" : views[0];
for (const t of all) if (keep.set && keep.set[t.css] != null) t.now = keep.set[t.css];
const max = t => t.cls === "Text" || t.cls === "Hero" ? Math.max(80, t.value * 2) : Math.max(t.value * 2, t.value + 40);
function draw() {
  const q = find.value.trim().toLowerCase(); let html = "", group = "";
  for (const t of all) {
    if (t.computed || (q && !(t.cls + " " + t.field).toLowerCase().includes(q))) continue;
    if (t.cls !== group) { group = t.cls; html += `<h2>${group}</h2>`; }
    html += `<div class="t${t.now !== t.value ? " changed" : ""}" data-k="${t.css}"><label title="${t.cls}.${t.field} (was ${t.value})">${t.field}</label>` +
            `<input type="range" min="0" max="${max(t)}" step="1" value="${t.now}"><output title="Set back to ${t.value}">${t.now}</output></div>`;
  }
  list.innerHTML = html;
}
let timer = 0;
function show() {
  const set = all.filter(t => t.now !== t.value).map(t => t.css + ":" + t.now).join(",");
  page.src = "panel-preview.html?view=" + encodeURIComponent(view.value) + (set ? "&set=" + set : "");
  save();
}
const later = () => { clearTimeout(timer); timer = setTimeout(show, 250); };
list.addEventListener("input", e => { const row = e.target.closest(".t"); if (!row) return; const t = all.find(x => x.css === row.dataset.k); t.now = +e.target.value;
  row.querySelector("output").textContent = t.now; row.classList.toggle("changed", t.now !== t.value); later(); });
list.addEventListener("click", e => { if (e.target.tagName !== "OUTPUT") return; const t = all.find(x => x.css === e.target.closest(".t").dataset.k); t.now = t.value; draw(); show(); });
find.addEventListener("input", draw);
view.addEventListener("change", show);
document.getElementById("reset").onclick = () => { for (const t of all) t.now = t.value; draw(); show(); };
document.getElementById("copy").onclick = () => {
  const changed = all.filter(t => t.now !== t.value);
  out.value = changed.length ? "// src/Panel/PanelLayout.cs: " + changed.length + (changed.length === 1 ? " change" : " changes") + "\n" + changed.map(t => `${t.cls}.${t.field} = ${t.now};   // was ${t.value}`).join("\n") : "// no changes";
  out.style.display = "block"; out.select(); navigator.clipboard?.writeText(out.value).catch(() => { });   // a page opened from disk may not get the clipboard: the text stays selected
};
const fit = () => { const s = Math.min(page.parentElement.clientWidth / 1280, page.parentElement.clientHeight / 860); page.style.transform = `scale(${s})`; };
addEventListener("resize", fit);
draw(); fit(); show();
</script>
</body>
</html>
