<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearthwoven panel preview</title>
<!-- Static preview of the in-game panel. It draws window.PANEL_DATA, written by `test-panel --dump` from PanelModel.Build
     on a fictional sample evening, with PanelUi.cs's layout numbers and the same UI kit PNGs (../ui/, nine-sliced with
     the borders from kit.json via CSS border-image). Stand-ins: Averia Serif Libre from Google Fonts for the game's
     own font and Cinzel for Norse. Item, piece and skill slots stay empty, as PanelUi leaves them when the game's sprite
     is missing: those sprites only exist inside the game. Status icons are drawn as a dot in the fallback colour. -->
<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<script src="preview-data.js"></script>
<style>
  :root { --text:#e9dcc4; --muted:#b9a688; --faint:#8c7b62; --gold:#e8c27a; --accent:#e8a948; --rule:rgba(107,82,51,.6); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1280px; height:860px; font-family:"Averia Serif Libre", Georgia, serif; color:var(--text); position:relative; overflow:hidden;
         background: radial-gradient(ellipse at 25% 75%, #6a4320 0%, #2a2018 32%, #141618 72%), #141618; }
  .world { position:absolute; inset:0; background: repeating-linear-gradient(100deg, rgba(0,0,0,.25) 0 40px, rgba(255,255,255,.02) 40px 90px); }
  /* nine-slices from kit.json (left, top, right, bottom) -> border-image (top right bottom left) */
  .k-frame { border-image:url(../ui/frame.png) 56 56 56 56 fill / 56px 56px 56px 56px stretch; }
  .k-tab { border-image:url(../ui/tab.png) 20 20 16 20 fill / 20px 20px 16px 20px stretch; }
  .k-tab.on { border-image-source:url(../ui/tab-selected.png); }
  .k-row { border-image:url(../ui/row.png) 20 20 20 20 fill / 20px stretch; }
  .k-row.on { border-image-source:url(../ui/row-selected.png); }
  .k-toggle { border-image:url(../ui/toggle.png) 16 20 16 60 fill / 16px 20px 16px 60px stretch; }
  .k-toggle.on { border-image-source:url(../ui/toggle-selected.png); }
  .k-slot { border-image:url(../ui/slot.png) 16 16 16 16 fill / 16px stretch; }
  .k-track { border-image:url(../ui/meter-track.png) 5 5 5 5 fill / 5px stretch; }
  .k-divider { height:16px; flex:none; border-image:url(../ui/divider.png) 0 24 0 24 fill / 0 24px 0 24px stretch; }
  .panel { position:absolute; left:50px; top:30px; width:1180px; height:760px; }
  .wordmark { position:absolute; left:66px; top:22px; height:44px; display:flex; align-items:center; font-family:Cinzel, serif; font-size:32px; color:var(--gold); }
  .owner { position:absolute; left:385px; top:22px; height:44px; display:flex; align-items:center; font-size:20px; }
  .players { position:absolute; right:64px; top:20px; height:48px; display:flex; gap:8px; }
  .entry { position:relative; display:flex; align-items:center; gap:14px; padding:0 20px 0 14px; white-space:nowrap; font-size:18px; color:var(--text); flex:none; }
  .entry.on { color:var(--gold); } .entry.noicon { padding-left:20px; }
  .chapters { position:absolute; left:32px; right:32px; top:77px; height:78px; display:flex; gap:12px; }
  .tab { flex:1; height:78px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:10px 4px 8px; font-size:20px; }
  .tab img { width:32px; height:32px; } .tab.on { color:var(--gold); } .tab.on img { filter: sepia(1) saturate(3) hue-rotate(-12deg) brightness(1.05); }
  .listtitle { position:absolute; left:32px; top:180px; width:268px; height:36px; font-size:24px; color:var(--gold); display:flex; align-items:center; }
  .list { position:absolute; left:32px; top:226px; width:268px; bottom:72px; display:flex; flex-direction:column; gap:16px; padding:2px; overflow:hidden; }
  .list .entry { flex:none; font-size:22px; } .list.compact { gap:4px; }
  .sharenote { width:330px; display:flex; align-items:center; justify-content:flex-end; text-align:right; font-size:13px; font-style:italic; color:var(--muted); white-space:normal; }
  .sharenote.alone { width:420px; }
  .content { position:absolute; left:343px; right:40px; top:180px; bottom:72px; }
  .heading { height:36px; font-size:26px; color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; }
  .scope { margin-top:2px; height:26px; font-size:18px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .blocks { position:absolute; top:76px; left:0; right:0; bottom:0; overflow:hidden; display:flex; flex-direction:column; gap:12px; padding:2px; }
  .row { display:flex; gap:14px; align-items:center; }
  .m { flex:none; display:flex; align-items:center; justify-content:center; }
  .m img { width:100%; height:100%; object-fit:contain; }
  .shield { -webkit-mask:url(../ui/shield.png) center/contain no-repeat; mask:url(../ui/shield.png) center/contain no-repeat; background-blend-mode:multiply; }
  .section { font-size:20px; color:var(--gold); margin-top:4px; }
  .note { font-size:13px; color:var(--faint); } .plain { font-size:15px; color:var(--muted); }
  .hint { display:flex; gap:10px; font-size:17px; } .hint::before { content:""; width:3px; flex:none; background:var(--accent); }
  .stat { display:flex; gap:16px; align-items:center; } .stat .v { font-size:30px; } .stat .t { font-size:22px; } .stat .s { font-size:18px; color:var(--muted); } .stat .n { font-size:13px; color:var(--faint); }
  .tiles { display:grid; grid-template-columns:repeat(6, 112px); gap:8px 16px; }
  .tile { height:150px; display:flex; flex-direction:column; align-items:center; }
  .tile .nm { margin-top:4px; font-size:15px; width:112px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .tile .ct { font-size:19px; color:var(--gold); }
  .bar { display:flex; gap:14px; align-items:center; } .bar .lb { width:120px; font-size:20px; } .bar .tr { flex:1; height:20px; position:relative; }
  .bar .fl { position:absolute; left:3px; top:3px; bottom:3px; border-radius:3px; background-image:url(../ui/meter-fill.png); background-size:100% 100%; background-blend-mode:multiply; }
  .bar .vl { width:80px; text-align:right; font-size:20px; } .bar .ic { width:26px; height:26px; display:flex; align-items:center; justify-content:center; } .bar .ic i { width:16px; height:16px; border-radius:50%; }
  .axis { display:flex; font-size:13px; color:var(--faint); padding-left:174px; padding-right:94px; justify-content:space-between; }
  .rows .r { display:flex; gap:14px; align-items:center; min-height:38px; border-bottom:1px solid var(--rule); font-size:19px; } .rows .r .t { flex:1; } .rows .r .v { width:170px; text-align:right; }
  .titles { display:grid; grid-template-columns:repeat(3, 258px); gap:6px 10px; }
  .tcard { position:relative; height:64px; } .tcard .m { position:absolute; left:12px; top:12px; }
  .tcard .tn { position:absolute; left:60px; top:6px; font-size:17px; color:var(--gold); } .tcard .tv { position:absolute; left:60px; top:27px; width:190px; font-size:12.5px; font-style:italic; color:var(--muted); line-height:1.2; }
  .thread .ends { display:flex; justify-content:space-between; font-size:20px; }
  .thread .fr { display:flex; align-items:center; gap:20px; margin-top:8px; }
  .thread .item { width:120px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:18px; }
  .thread .mid { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:24px; }
  .thread .mid img { width:320px; height:40px; }
  .empty { font-size:20px; font-style:italic; color:var(--muted); } .emptytext { font-size:16px; color:var(--faint); }
  .badges { display:flex; gap:18px; } .badges span { font-size:18px; color:var(--gold); }
  .controls { display:flex; gap:8px; } .controls .entry { height:48px; }
  .toggles { display:flex; gap:14px; } .toggle { flex:1; height:72px; display:flex; align-items:center; padding-left:62px; font-size:21px; } .toggle.on { color:var(--gold); }
  .button { align-self:flex-start; height:48px; }
  .keys { position:absolute; left:64px; right:64px; bottom:22px; height:30px; display:flex; align-items:center; gap:36px; font-size:15px; color:var(--muted); }
  .caption { position:absolute; left:50px; bottom:16px; font-size:12px; color:#9a8a74; font-family:Georgia, serif; }
</style>
</head>
<body>
<div class="world"></div>
<div id="app"></div>
<p class="caption" id="caption"></p>
<script>
// PanelLook fallback colours (in game, elements are sampled from the status icons) and the person palette
const TONE = { poison:"#6fae3a", fire:"#e0582a", frost:"#8ec9e8", lightning:"#8d7be6", spirit:"#c9e4e0",
  slash:"#a8a49b", pierce:"#c4bfb4", blunt:"#8a867e", chop:"#736f68", pickaxe:"#5f5b55", damage:"#9b8f80", ember:"#e8a948" };
const PEOPLE = ["#a83a2c", "#3b62a0", "#d8d2c0", "#5f8a3b", "#c08a2e", "#7a52a0", "#2f8a82", "#8a5a3a"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
function personColor(name) { const map = window.CURRENT.personColors || {}; const k = Object.keys(map).find(n => n.toLowerCase() === name.toLowerCase()); return PEOPLE[k ? map[k] - 1 : 0]; }
const NEW_TITLES = ["woodcutter", "mapmaker", "mender", "wallwarden", "bossbane"];
// as PanelUi.Marker: kit/title art, a person's shield in their colour (multiplied over the grayscale kit shield),
// the status colour, or nothing where the game's own sprite would be
function marker(icon, size) {
  const s = `width:${size}px;height:${size}px`;
  if (!icon) return "";
  const [kind, key] = [icon.slice(0, icon.indexOf(":")), icon.slice(icon.indexOf(":") + 1)];
  if (kind === "person") return `<span class="m shield" style="${s};background:url(../ui/shield.png) center/contain no-repeat, ${personColor(key)}"></span>`;
  if (kind === "title") return `<span class="m" style="${s}"><img src="${NEW_TITLES.includes(key) ? `../ui/title-${key}.png` : `../icons/${key}.png`}" alt=""></span>`;
  if (kind === "ui") return `<span class="m" style="${s}"><img src="../ui/${key}.png" alt=""></span>`;
  if (kind === "status") return `<span class="m" style="${s}"><i style="width:${size * 0.6}px;height:${size * 0.6}px;border-radius:50%;background:${TONE[key]}"></i></span>`;
  return `<span class="m" style="${s}"></span>`;   // item / piece / skill: the game's sprite, only in game
}
const hasIcon = icon => icon && /^(person|title|ui|status):/.test(icon);
const slot = (size) => `<div class="k-slot" style="width:${size}px;height:${size}px"></div>`;
const tiles = items => `<div class="tiles">${items.map(t => `<div class="tile">${slot(96)}<div class="nm">${esc(t.title)}</div>${t.value ? `<div class="ct">${esc(t.value)}</div>` : ""}</div>`).join("")}</div>`;
const note = n => n ? `<div class="note">${esc(n)}</div>` : "";
const entry = (c, h = 48, cls = "") => `<div class="entry k-row${c.selected ? " on" : ""}${hasIcon(c.icon) ? "" : " noicon"} ${cls}" style="height:${h}px">${hasIcon(c.icon) ? marker(c.icon, h - 20) : ""}${esc(c.label)}</div>`;
function block(b) {
  switch (b.kind) {
    case "section": return `<div class="section">${esc(b.title)}</div>`;
    case "divider": return `<div class="k-divider"></div>`;
    case "stat": return `<div class="stat">${b.icon ? marker(b.icon, 52) : ""}<div><div class="row" style="align-items:baseline;gap:10px">${b.value ? `<span class="v">${esc(b.value)}</span>` : ""}<span class="t">${esc(b.title)}</span></div>
      ${b.text ? `<div class="s">${esc(b.text)}</div>` : ""}${b.note ? `<div class="n">${esc(b.note)}</div>` : ""}</div></div>`;
    case "tiles": return tiles(b.items) + note(b.note);
    case "bars": return b.items.map(i => `<div class="bar"><span class="ic">${i.icon ? `<i style="background:${TONE[i.tone]}"></i>` : ""}</span>
      <span class="lb" style="color:${i.tone === "ember" ? (i.selected ? "var(--gold)" : "var(--text)") : TONE[i.tone]}">${esc(i.title)}</span>
      <span class="tr k-track">${i.fraction > 0 ? `<span class="fl" style="width:calc(${(i.fraction * 100).toFixed(2)}% - 6px);background-color:${TONE[i.tone] || TONE.ember}"></span>` : ""}</span><span class="vl">${esc(i.value)}</span></div>`).join("")
      + (b.value ? `<div class="axis"><span>0</span><span>${esc(b.value)}</span></div>` : "") + note(b.note);
    case "rows": return `<div class="rows">${b.items.map(i => `<div class="r">${hasIcon(i.icon) ? marker(i.icon, 34) : ""}<span class="t">${esc(i.title)}</span><span class="v">${esc(i.value)}</span></div>`).join("")}</div>` + note(b.note);
    case "titles": return `<div class="titles">${b.items.map(t => `<div class="tcard k-row">${marker(t.icon, 40)}<div class="tn">${esc(t.title)}</div><div class="tv">${esc(t.value)}</div></div>`).join("")}</div>`;
    case "thread": return `<div class="thread"><div class="ends"><span>${esc(b.title)}</span><span>${esc(b.text)}</span></div>` +
      b.items.map((t, i) => `<div class="fr"><div class="item">${slot(112)}<span>${esc(t.title)}</span></div>
        <div class="mid"><span>${esc(t.value)} ${esc(t.title.toLowerCase())}</span><img src="../ui/thread.png" alt=""></div>
        <div style="width:120px;display:flex;justify-content:center">${i === 0 ? marker(b.icon, 112) : ""}</div></div>`).join("") + `</div><div class="k-divider"></div>` + note(b.note);
    case "link": return `<div class="entry k-row button" style="height:48px">${marker(b.icon, 28)}${esc(b.title)}</div>`;
    case "empty": return `<div class="empty">${esc(b.title)}</div>` + (b.text ? `<div class="emptytext">${esc(b.text)}</div>` : "");
    default: return b.tone === "hint" ? `<div class="hint"><span>${esc(b.text)}</span></div>` : `<div class="plain">${esc(b.text)}</div>`;
  }
}

const name = new URLSearchParams(location.search).get("view") || "deeds";
const v = window.CURRENT = window.PANEL_DATA[name];
const sel = v.biomes.find(b => b.selected) || v.biomes[0];
let inner = "";
if (v.badges.length) inner += `<div class="badges">${v.badges.map(b => `<div class="row" style="gap:8px">${marker(b.icon, 34)}<span>${esc(b.label)}</span></div>`).join("")}</div>`;
if (v.hasFilters) inner += `<div class="controls">${v.windows.map(w => entry(w)).join("")}${entry({ label: "Biome: " + sel.label, selected: !!sel.id })}</div>`;
if (v.toggle.length) inner += `<div class="toggles">${v.toggle.map(t => `<div class="toggle k-toggle${t.selected ? " on" : ""}">${esc(t.label)}</div>`).join("")}</div>`;
inner += v.blocks.map(block).join("");
if (v.howCounted) inner += `<div class="entry k-row button noicon" style="height:48px">${v.showHow ? "Hide" : "Show"} how this was counted [I]</div>` + (v.showHow ? `<div class="plain">${esc(v.howCounted)}</div>` : "");
document.getElementById("app").innerHTML = `
<div class="panel k-frame">
  <div class="wordmark">HEARTHWOVEN</div>
  ${v.players.length ? "" : `<div class="owner">${esc(v.owner)}</div>`}
  <div class="players">${v.shareNote ? `<div class="sharenote${v.players.length ? "" : " alone"}">${esc(v.shareNote)}</div>` : ""}${v.players.slice(0, 6).map(p => entry(p)).join("")}${v.players.length > 6 ? entry({ label: "More" }) : ""}</div>
  <div class="chapters">${v.chapters.map(c => `<div class="tab k-tab${c.selected ? " on" : ""}"><img src="../ui/${c.icon.slice(3)}.png" alt="">${esc(c.label)}</div>`).join("")}</div>
  <div class="listtitle">${esc(v.listTitle)}</div>
  <div class="list${v.list.length > 5 ? " compact" : ""}">${v.list.map(c => entry(c, v.list.length > 5 ? 48 : 68)).join("")}</div>
  <div class="content"><div class="heading">${esc(v.heading)}</div><div class="scope">${esc(v.scope)}</div><div class="blocks">${inner}</div></div>
  <div class="keys">${v.keys.map(k => `<span>${esc(k.text)}</span>`).join("")}</div>
</div>`;
document.getElementById("caption").textContent = `Preview "${name}": PanelModel output on fictional sample data, drawn with PanelUi's layout and the UI kit sprites. Empty slots and icon places hold the game's own sprites in game.`;
</script>
</body>
</html>
