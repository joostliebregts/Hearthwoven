<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearthwoven panel preview</title>
<!-- Static preview of the in-game panel. It draws window.PANEL_DATA, written by `test-panel --dump` from PanelModel.Build
     on a fictional sample evening, with PanelUi.cs's layout numbers and the same UI kit PNGs (../ui/, nine-sliced with
     the borders from kit.json via CSS border-image). Stand-ins: Averia Serif Libre from Google Fonts for the game's
     own font and Cinzel for Norse. Item, piece and skill slots stay empty, as PanelUi leaves them when the game's sprite
     is missing: those sprites only exist inside the game. Status icons are drawn as a dot in the fallback colour.
     The vocabulary kinds (composition, biomes, ladders, ladder) use the forms of work/hearthwoven-visual-vocabulary/proto
     with Codex's sprites from ../vocab/; ladder parts are drawn rects here. No icons beside numbers (Joost 2026-10-08):
     only a number counted on this PC gets the "since install" label, where the model placed it (Block.SinceInstall).
     Page layout (slice 3): a page whose only block is a plate gets PanelUi's heading row (icon, pill or window choices)
     and the recessed plate from the list's top line; hero, columns, switch (chosen view only) and cards inside, at the
     widths PanelUi uses (plate inside 741 px). Battle (ch-battle): damagegrid, dmgmix, foetable, foetypes, guard, sources,
     deathstrip, deaths, as Chapters/BattleUi.cs draws them; Codex's dmg-*/weapon-* masks tinted through CSS masks. "deeds-cards" is a preview-only sample of the cards. -->

<link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<script src="preview-data.js"></script>
<script src="zones-preview.js"></script>
<style>
  :root { --text:#e9dcc4; --muted:#b9a688; --faint:#b0a086; --mintext:14px; --gold:#e8c27a; --accent:#e8a948; --rule:rgba(107,82,51,.6); --focus:#fff3d6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1280px; height:860px; font-family:"Averia Serif Libre", Georgia, serif; color:var(--text); position:relative; overflow:hidden;
         background: radial-gradient(ellipse at 25% 75%, #6a4320 0%, #2a2018 32%, #141618 72%), #141618; }
  .world { position:absolute; inset:0; background: repeating-linear-gradient(100deg, rgba(0,0,0,.25) 0 40px, rgba(255,255,255,.02) 40px 90px); }
  /* nine-slices from kit.json (left, top, right, bottom) -> border-image (top right bottom left) */
  .k-frame { border-image:url(../ui/frame.png) 56 56 56 56 fill / 56px 56px 56px 56px stretch; }
  .k-tab { border-image:url(../ui/tab.png) 20 20 16 20 fill / 20px 20px 16px 20px stretch; }
  .k-tab.on { border-image-source:url(../ui/tab-selected.png); }
  .k-row { border-image:url(../ui/row.png) 20 20 20 20 fill / 20px stretch; }
  .k-row.on { border-image-source:url(../ui/row-selected.png); }
  .k-toggle { border-image:url(../ui/toggle.png) 16 20 16 60 fill / 16px 20px 16px 60px stretch; }
  .k-toggle.on { border-image-source:url(../ui/toggle-selected.png); }
  .k-slot { border-image:url(../ui/slot.png) 16 16 16 16 fill / 16px stretch; }
  .k-track { border-image:url(../ui/meter-track.png) 5 5 5 5 fill / 5px stretch; }
  .k-divider { height:16px; flex:none; border-image:url(../ui/divider.png) 0 24 0 24 fill / 0 24px 0 24px stretch; }
  .panel { position:absolute; left:50px; top:30px; width:1180px; height:760px; }
  .wordmark { position:absolute; left:66px; top:22px; height:44px; display:flex; align-items:center; font-family:Cinzel, serif; font-size:32px; color:var(--gold); }
  .logo { position:absolute; left:64px; top:14px; height:60px; width:auto; }   /* PanelUi: Joost's logo, 60 px high, centred on the chips row; the wordmark is its fallback */
  .owner { position:absolute; left:385px; top:22px; height:44px; display:flex; align-items:center; font-size:20px; }
  .players { position:absolute; right:64px; top:20px; height:48px; display:flex; gap:8px; }
  .entry { position:relative; display:flex; align-items:center; gap:14px; padding:0 20px 0 14px; white-space:nowrap; font-size:18px; color:var(--text); flex:none; }
  .entry.on { color:var(--gold); } .entry.noicon { padding-left:20px; }
  .chapters { position:absolute; left:32px; right:32px; top:77px; height:78px; display:flex; gap:12px; }
  .tab { flex:1; height:78px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:10px 4px 8px; font-size:20px; }
  .tab img { width:32px; height:32px; } .tab.on { color:var(--gold); } .tab.on img { filter: sepia(1) saturate(3) hue-rotate(-12deg) brightness(1.05); }
  .listtitle { position:absolute; left:32px; top:180px; width:268px; height:36px; font-size:24px; color:var(--gold); display:flex; align-items:center; }
  .list { position:absolute; left:32px; top:226px; width:268px; bottom:72px; display:flex; flex-direction:column; gap:16px; padding:2px; overflow:hidden; }
  .list .entry { flex:none; font-size:22px; } .list.compact { gap:4px; }
  .sharenote { width:330px; display:flex; align-items:center; justify-content:flex-end; text-align:right; font-size:15px; color:var(--muted); white-space:normal; }
  .sharenote.alone { width:572px; height:48px; box-sizing:border-box; flex-direction:column; align-items:flex-start; justify-content:center; text-align:left; padding:0 10px 0 40px; position:relative; background:rgba(8,6,5,.85); box-shadow:inset 0 0 0 1px #3a2c1c; border-radius:5px; white-space:nowrap; line-height:1.3; }
  .sharenote.alone b { color:var(--text); font-weight:700; } .sharenote.alone img { position:absolute; left:10px; top:14px; width:20px; height:20px; }
  .content { position:absolute; left:343px; right:40px; top:180px; bottom:72px; }
  .heading { height:36px; font-size:26px; color:var(--gold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; }
  .scope { margin-top:2px; height:26px; font-size:18px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .blocks { position:absolute; top:76px; left:0; right:0; bottom:0; overflow:hidden; display:flex; flex-direction:column; gap:12px; padding:2px; }
  .row { display:flex; gap:14px; align-items:center; }
  .m { flex:none; display:flex; align-items:center; justify-content:center; }
  .m img { width:100%; height:100%; object-fit:contain; }
  .shield { -webkit-mask:url(../ui/shield.png) center/contain no-repeat; mask:url(../ui/shield.png) center/contain no-repeat; background-blend-mode:multiply; }
  .section { font-size:20px; color:var(--gold); margin-top:4px; }
  .note { font-size:var(--mintext); color:var(--faint); } .plain { font-size:15px; color:var(--muted); }
  .hint { display:flex; gap:10px; font-size:17px; } .hint::before { content:""; width:3px; flex:none; background:var(--accent); }
  .stat { display:flex; gap:16px; align-items:center; } .stat .v { font-size:30px; } .stat .t { font-size:22px; } .stat .s { font-size:18px; color:var(--muted); } .stat .n { font-size:var(--mintext); color:var(--faint); }
  /* compact stat (fix3-rest, Heavy Keel on Voyages > Cargo): one line, the number and its name, the rest muted beside them */
  .stat.compact { gap:10px; } .stat.compact .v { font-size:22px; } .stat.compact .t { font-size:16px; } .stat.compact .s { font-size:14px; } .stat.compact .row { flex-wrap:wrap; }
  .tiles { display:grid; grid-template-columns:repeat(6, 112px); gap:8px 16px; }
  .tile { height:150px; display:flex; flex-direction:column; align-items:center; }
  .tile .nm { margin-top:4px; font-size:15px; width:112px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .tile .ct { font-size:19px; color:var(--gold); }
  .bar { display:flex; gap:14px; align-items:center; } .bar .lb { width:120px; font-size:20px; } .bar .tr { flex:1; height:20px; position:relative; }
  .bar .fl { position:absolute; left:3px; top:3px; bottom:3px; border-radius:3px; background-image:url(../ui/meter-fill.png); background-size:100% 100%; background-blend-mode:multiply; }
  .bar .vl { width:80px; text-align:right; font-size:20px; } .bar .ic { width:26px; height:26px; display:flex; align-items:center; justify-content:center; } .bar .ic i { width:16px; height:16px; border-radius:50%; }
  .axis { display:flex; font-size:var(--mintext); color:var(--faint); padding-left:174px; padding-right:94px; justify-content:space-between; }
  .rows .r { display:flex; gap:14px; align-items:center; min-height:34px; border-bottom:1px solid var(--rule); font-size:19px; } .rows .r .t { flex:1; } .rows .r .v { width:170px; text-align:right; }
  .titles { display:grid; grid-template-columns:repeat(3, 258px); gap:6px 10px; }
  .tcard { position:relative; height:64px; } .tcard .m { position:absolute; left:12px; top:12px; }
  .tcard .tn { position:absolute; left:60px; top:6px; font-size:17px; color:var(--gold); } .tcard .tv { position:absolute; left:60px; top:27px; width:190px; font-size:var(--mintext); font-style:italic; color:var(--muted); line-height:1.2; }
  .thread .ends { display:flex; justify-content:space-between; font-size:20px; }
  .thread .fr { display:flex; align-items:center; gap:20px; margin-top:8px; }
  .thread .item { width:120px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:18px; }
  .thread .mid { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:24px; }
  .thread .mid img { width:320px; height:40px; }
  .empty { font-size:18px; font-style:italic; color:var(--muted); } .emptytext { font-size:15px; color:var(--faint); margin-top:-12px; }
  .badges { display:flex; gap:18px; } .badges span { font-size:18px; color:var(--gold); }
  .controls { display:flex; gap:8px; } .controls .entry { height:48px; }
  .toggles { display:flex; gap:14px; } .toggle { flex:1; height:72px; display:flex; align-items:center; padding-left:62px; font-size:21px; } .toggle.on { color:var(--gold); }
  .button { align-self:flex-start; height:48px; }
  .keys { position:absolute; left:64px; right:64px; bottom:22px; height:30px; display:flex; align-items:center; gap:36px; font-size:15px; color:var(--muted); }
  .caption { position:absolute; left:50px; bottom:16px; font-size:var(--mintext); color:#9a8a74; font-family:Georgia, serif; }

  /* ---------- feats (Chapters/FeatsUi.cs): the grid of cards, the one fixed detail area, Known for, the owner-page band ---------- */
  .tab { position:relative; } .dot { position:absolute; right:8px; top:8px; width:11px; height:11px; border-radius:50%; background:var(--accent); } .tab .dot { right:10px; top:8px; }
  .feats { display:grid; gap:6px 8px; }
  .fgrid { position:relative; flex:none; overflow:hidden; max-height:226px; }   /* PanelModel.FeatsGridRoom: four whole rows (4 x 52 + 3 x 6); more rows scroll inside it with a fade and the cue, the detail area under it stays put */
  .fcue { position:absolute; display:flex; justify-content:center; pointer-events:none; } .fcue span { height:22px; line-height:22px; padding:0 11px; font-size:var(--mintext); color:var(--gold); background:rgba(9,7,5,.92); box-shadow:inset 0 0 0 1px rgba(232,194,122,.5); white-space:nowrap; }   /* PanelModel.FeatsMore, FeatsUi's MoreCue */
  .fcard { position:relative; height:var(--fh, 52px); } .fcard.waiting .m.mk, .fdet.waiting .m.mk { filter:grayscale(1) opacity(.28); } .fcard .m { position:absolute; left:9px; top:var(--mt, 5px); } .fcard:not(.waiting) .m img { filter:grayscale(1) opacity(.5); }
  .fcard.earned { box-shadow:inset 0 0 0 1px var(--tier), inset 3px 0 0 var(--tier); } .fcard.earned .m img { filter:none; }   /* the tier's colour (PanelModel.TierColour): rim and a left bar */
  .plate.full .fgrid { flex:1 1 auto; max-height:none; min-height:52px; }   /* PanelModel.PlateFull: the grid takes the room the detail area leaves (FeatsUi.FeatsRoom) */
  .tierw { font-weight:700; }
  .fcard:not(.waiting) .m.mk, .fdet:not(.earned):not(.waiting) .m.mk { filter:grayscale(1) opacity(.5); } .fcard.earned .m.mk { filter:none; }
  /* live-polish: the keyboard focus (feat card, filter chip, biome tile) is one soft gold glow with rounded corners (vocab/focus-ring.png,
     sliced 14 px, the line 2 px outside the box), shown only after a key press: hidden while the mouse is used (focus-visible, PanelUi.FocusRing) */
  .fcard.sel::after, .fb-chip.cur::after, .b2-col.cur .b2-tile::after { content:""; position:absolute; inset:-10px; pointer-events:none; display:none; background:rgba(232,194,122,.9);
    -webkit-mask-box-image:url(../vocab/focus-ring.png) 14 / 14px stretch; }
  body.kbd .fcard.sel::after, body.kbd .fb-chip.cur::after, body.kbd .b2-col.cur .b2-tile::after { display:block; }
  .fcard .ft { position:absolute; left:52px; right:8px; top:2px; bottom:2px; display:flex; flex-direction:column; justify-content:center; }   /* the name and its small line stacked, one size: a long name wraps (FeatsUi.FeatCard) */
  .fcard .fn { font-size:15px; line-height:17px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .fcard.earned .fn { color:var(--text); } .fcard .fn.one { -webkit-line-clamp:1; }
  .fcard .fw { height:16px; line-height:16px; font-size:var(--mintext); color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }   /* feats-real: why an Unsung feat reads 0, or the next tier on an earned one (FeatsUi.FeatCard) */
  .fcard .nt.nx { background:none; box-shadow:inset 0 0 0 1px rgba(158,140,102,.9); }   /* the next tier only, as an outline (FeatsUi.FeatNotches) */
  .fcard .fm { height:17px; line-height:17px; font-size:var(--mintext); font-style:italic; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fcard.waiting, .fdet.waiting { outline:1px dashed rgba(185,166,136,.7); outline-offset:-2px; } .fcard.waiting .m img, .fdet.waiting .m img { filter:grayscale(1) opacity(.28); }   /* not counted yet: a dashed rim, a fainter emblem */
  .fcard .nt { position:absolute; top:calc(var(--mt, 5px) + 39px); width:12px; height:5px; background:#76643f; } .fnotch { position:absolute; left:9px; top:44px; display:flex; gap:3px; } .fnotch i { display:block; width:12px; height:5px; background:#76643f; } .fnotch i.on { background:var(--gold); }   /* each reached notch in its tier's colour (inline) */
  .fdet { position:relative; height:164px; flex:none; } .fdet.earned { box-shadow:inset 0 0 0 1px var(--tier), inset 3px 0 0 var(--tier); }
  .fdet .fcrew { position:absolute; left:292px; right:16px; height:22px; display:flex; align-items:center; gap:4px; font-size:14px; white-space:nowrap; } .fdet .fcrew .m { position:static; } .fdet .fcrew > span:first-child { font-size:var(--mintext); color:var(--faint); margin-right:6px; } .fdet .fcrew .cn { margin-right:10px; }
  .fdet .mo i { color:var(--muted); }
  .fdet .m { position:absolute; left:16px; top:14px; } .fdet:not(.earned):not(.waiting) .m img { filter:grayscale(1) opacity(.5); }
  .fdet .dn { position:absolute; left:84px; top:12px; width:200px; height:30px; line-height:30px; font-size:22px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .fdet.earned .dn { color:var(--text); }
  .fdet .dt { position:absolute; left:84px; top:44px; width:200px; height:22px; line-height:22px; font-size:14px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .fdet.earned .dt { color:var(--tier); font-weight:700; }
  .fdet .dh { position:absolute; left:16px; top:74px; width:260px; height:40px; font-size:15px; font-style:italic; color:var(--muted); overflow:hidden; }
  .fdet .rl { position:absolute; left:292px; right:16px; height:22px; line-height:22px; font-size:15px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .fdet .rl.on { color:var(--text); }
  .fdet .rl b { display:inline-block; width:32px; color:var(--faint); } .fdet .rl.on b { color:var(--rc, var(--gold)); }
  .fdet .pg { position:absolute; left:292px; right:16px; height:22px; } .fdet .pg .tr { position:absolute; left:0; right:196px; top:6px; height:10px; } .fdet .pg .fl { position:absolute; left:2px; top:2px; bottom:2px; background:var(--accent); }
  .fdet .pg .pt { position:absolute; right:0; top:0; width:186px; line-height:22px; font-size:14px; white-space:nowrap; }
  .fdet .cb { position:absolute; left:292px; right:16px; height:18px; line-height:18px; font-size:var(--mintext); color:var(--muted); white-space:nowrap; } .fdet .cb span { display:inline-block; margin-right:8px; color:var(--faint); }
  .fdet .cv { position:absolute; left:292px; right:16px; height:36px; font-size:var(--mintext); font-style:italic; color:var(--muted); overflow:hidden; }
  .fdet .mo { position:absolute; left:16px; width:262px; top:119px; height:41px; line-height:19px; font-size:15px; color:var(--text); overflow:hidden; }
  .kfor { display:flex; gap:10px; align-items:center; height:36px; } .kfor .kfh { font-size:15px; font-weight:700; color:var(--gold); white-space:nowrap; }
  .kfor .kfc { display:flex; align-items:center; gap:6px; padding:4px 12px 4px 8px; box-shadow:inset 0 0 0 1px var(--tier, rgba(232,194,122,.85)); font-size:15px; color:var(--text); white-space:nowrap; } .kfor .kfc b { color:var(--tier); }
  /* fix4: the page's feat and its titles in ONE flat strip (FeatsUi.FeatBandBlock): a dark ground, a gold edge at its left, no raised border */
  .earned { display:flex; flex-wrap:wrap; align-items:center; column-gap:18px; padding:0 12px 0 15px; background:rgba(0,0,0,.30); box-shadow:inset 3px 0 0 var(--gold); }
  .earned > span { display:flex; align-items:center; gap:8px; height:34px; white-space:nowrap; }
  .earned .ea-tag { font-size:var(--mintext); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); } .earned .ea-tag.gold { color:var(--gold); }
  .earned .ea-i { display:inline-flex; align-items:center; gap:6px; margin-right:10px; } .earned .ea-i:last-of-type { margin-right:0; }
  .earned .ea-n { font-size:15px; color:var(--text); } .earned .ea-tn { font-size:15px; color:var(--text); }
  .earned .ea-m { font-size:var(--mintext); font-style:italic; color:var(--muted); margin-left:2px; }
  .earned .ea-rule { width:1px; height:20px; padding:0; background:var(--rule); }

  /* ---------- the visual vocabulary (forms ported from work/hearthwoven-visual-vocabulary/proto: vocab.js compBar,
     r2-refine.js biomeStrip2, r2-skills.js ladders); sprites from ../vocab/ (Codex's set) ---------- */
  .since { font-style:italic; color:var(--faint); font-size:14px; margin-left:8px; white-space:nowrap; flex:none; }
  .heading .since { font-size:15px; margin-left:12px; } .since.under { display:block; margin-left:0; font-size:var(--mintext); }
  .q { color:var(--faint); font-size:var(--mintext); margin-left:6px; }
  .tot { color:var(--gold); margin-left:8px; }
  .cmp-h { font-size:20px; color:var(--gold); display:flex; align-items:center; }
  .cmp-h .tot { color:var(--text); font-weight:700; }
  .cb-bar { position:relative; height:30px; margin-top:6px; border-radius:4px; background:rgba(0,0,0,.45); box-shadow:inset 0 0 0 1px rgba(107,82,51,.7); }
  .cb-seg { position:absolute; top:3px; bottom:3px; border-radius:2px; overflow:hidden; box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.25); }
  .cb-veil { position:absolute; left:0; top:0; bottom:0; background:rgba(9,7,5,.45); }   /* the fill at 55 % over the track (diff-05) */
  .cmp-key { display:flex; flex-wrap:wrap; gap:4px 22px; margin-top:8px; }
  .cb-lab { display:flex; align-items:center; gap:7px; height:26px; white-space:nowrap; }
  .cb-sw { width:26px; height:14px; border-radius:3px; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.5); }
  .cb-n { font-size:20px; font-weight:700; } .cb-t { font-size:15px; color:var(--muted); }
  .bs-legend, .b2-key { display:flex; align-items:center; gap:6px; font-size:15px; white-space:nowrap; }
  .b2-key { font-size:14px; color:var(--muted); margin-top:2px; } .b2-key img { width:16px; height:16px; }
  .bs-legend .sp, .b2-key .sp { width:22px; } .bs-legend b { font-weight:700; }
  .bs-legend .sw { width:14px; height:14px; border-radius:2px; } .sw.dealt { background:#e8a948; } .sw.hurt { background:#b8432e; }
  .b2 { display:grid; column-gap:4px; }
  .b2-col { display:flex; flex-direction:column; min-width:0; } .b2-col.sea { margin-left:14px; }
  .b2-up { display:flex; flex-direction:column; justify-content:flex-end; align-items:center; }
  .b2-down { display:flex; flex-direction:column; align-items:center; }
  .b2-bar { width:44%; } .b2-bar.dealt { background:#e8a948; } .b2-bar.hurt { background:#b8432e; }
  .b2-v { font-size:16px; font-weight:700; line-height:20px; } .b2-v.r { color:#e09a84; }
  .b2-tile { position:relative; height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border-radius:3px; font-size:14px; white-space:nowrap; }
  .b2-col.on .b2-tile { box-shadow:0 0 0 2px var(--gold); }
  .bs-legend .q, .bt-cap .q, .b2-key { color:var(--muted); }   /* Battle's qualifiers: 13 px text reads at 4.5:1 on the plate */

const PEOPLE = ["#d6ccb3", "#9b4a50", "#5f86a0", "#94a56c", "#c4923f", "#8f7599", "#4d7a69", "#80807c"];   // fallback only: the dump carries PanelModel.PlayerPalette
